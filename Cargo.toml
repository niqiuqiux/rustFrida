[workspace]
resolver = "2"
members = [
    "frida-gum-sys",
    "frida-gum",
    "rust_frida",
    "agent",
    "qbdi-helper",
    "ldmonitor",
    "ldmonitor-common",
    "ldmonitor-ebpf",
    "qbdi",
    "quickjs-hook",
    "qbdi-trace-dump"
]
# We miss our linux_no_std example from the default members since `cargo check`
# and `cargo test` both attempt to link the `std` library into it in error.
default-members = ["frida-gum-sys", "frida-gum", "rust_frida", "agent"]

[workspace.package]
version = "0.16.10"
authors = [
    "Keegan Saunders <keegan@undefinedbehaviour.org>",
    "Shmarya Rubenstein <github@shmarya.net>",
]
edition = "2021"
license = "wxWindows"
repository = "https://github.com/frida/frida-rust"
description = "Rust bindings for Frida"

[workspace.dependencies]
anyhow = "1"
aya = "0.13"
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
aya-build = "0.1"
bytes = "1"
cargo_metadata = "0.19"
clap = "4"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
tokio = "1"
which = "7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# 保持与生产构建相同的优化级别，同时保留 LLDB/addr2line 所需符号。
[profile.release-symbols]
inherits = "release"
debug = 2
strip = "none"

[profile.dev]
strip = false
debug = 2
